<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ayesha | Private Memories</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Floating Hearts -->

    <div class="floating-heart heart1">♡</div>
    <div class="floating-heart heart2">♡</div>
    <div class="floating-heart heart3">♡</div>
    <div class="floating-heart heart4">♡</div>


    <main class="main">

        <!-- Lock -->

        <div class="lock">
            🔐
        </div>


        <p class="little-title">
            A LITTLE SECRET WAITING FOR YOU
        </p>


        <h1>
            Private <span>Memories</span>
        </h1>


        <p class="intro">

            A tiny little world made especially
            <br>
            for someone very special. ♡

        </p>


        <!-- Password Card -->

        <section class="password-card">


            <p class="card-title">
                ENTER THE SECRET CODE
            </p>


            <!-- Password Dots -->

            <div class="password-dots">

                <span id="dot1"></span>
                <span id="dot2"></span>
                <span id="dot3"></span>
                <span id="dot4"></span>

            </div>


            <!-- Hint -->

            <div class="hint">

                <div class="hint-heart">
                    💗
                </div>

                <div>

                    <b>Little Hint</b>

                    <br>

                    My birthday first...

                    <br>

                    then yours. ♡

                </div>

            </div>


            <!-- Keypad -->

            <div class="keypad">


                <button class="key"
                    data-number="1">
                    1
                </button>

                <button class="key"
                    data-number="2">
                    2
                </button>

                <button class="key"
                    data-number="3">
                    3
                </button>


                <button class="key"
                    data-number="4">
                    4
                </button>

                <button class="key"
                    data-number="5">
                    5
                </button>

                <button class="key"
                    data-number="6">
                    6
                </button>


                <button class="key"
                    data-number="7">
                    7
                </button>

                <button class="key"
                    data-number="8">
                    8
                </button>

                <button class="key"
                    data-number="9">
                    9
                </button>


                <button
                    class="key special"
                    id="clear">
                    ×
                </button>

                <button class="key"
                    data-number="0">
                    0
                </button>

                <button
                    class="key special"
                    id="enter">
                    →
                </button>


            </div>


            <p id="message"></p>


        </section>


        <p class="bottom-text">
            ✦ ONLY ONE SPECIAL PERSON CAN ENTER ✦
        </p>


    </main>


    <script src="script.js"></script>

</body>

</html>
